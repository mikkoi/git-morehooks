name    = Git-MoreHooks
version = 0.018
author  = 'Mikko Koivunalho <mikkoi@cpan.org>'
license = Perl_5
copyright_holder = Mikko Koivunalho
copyright_year   = 2022
main_module = lib/Git/MoreHooks.pm

[Meta::Contributors]
contributor = Gustavo L. de M. Chaves <gnustavo@cpan.org>

[MetaResources]
homepage            = https://metacpan.org/release/Git-MoreHooks
bugtracker.web      = http://rt.cpan.org/NoAuth/Bugs.html?Dist=Git-MoreHooks
bugtracker.mailto   = bug-Git-MoreHooks@rt.cpan.org
repository.url      = git://github.com/mikkoi/git-morehooks.git
repository.web      = https://github.com/mikkoi/git-morehooks.git
repository.type     = git

[Keywords]
keywords = git git-hooks

[@Filter]
-bundle = @MIKKOI
-version = 0.005

[Prereqs / DevelopSuggests]
Dist::Zilla::App::Command::podpreview = 0.004
Dist::Zilla::App::Command::cover = 0
Devel::Cover::Report::Codecov = 0
Devel::Cover::Report::Coveralls = 0

[Software::Policies / AIDisclosure]
policy_attribute = ai_tools = Claude AI, Copilot and Gemini

[Software::Policies / CodeOfConduct]
class = ContributorCovenant
version = 2.1

[Software::Policies / Contributing]
policy_attribute = ai_disclosure = 1
policy_attribute = ai_assisted = 1

[Software::Policies / License]
policy_attribute = perl_5_double_license = true

[Software::Policies / Security]
policy_attribute = url = https://github.com/mikkoi/git-morehooks/blob/main/SECURITY.md
policy_attribute = timeframe = 14 days
policy_attribute = perl_support_years = 10

[WeaveFile / README.md]

[Test::WeaveFile]

[Prereqs / DevelopSuggests]
Dist::Zilla::App::Command::podpreview = 0.004

[Prereqs / RuntimeRequires]
perl = 5.010

[Prereqs / RuntimeSuggests]
Perl::Tags = 0
